[project]
name = "eli"
version = "0.4.1"
description = "Claude Code plugin: explain by levels, from plain words to code"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[dependency-groups]
dev = ["playwright==1.58.0", "pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 110

[tool.uv]
# claude plugin eval refuses a plugin tree that holds hard links, and uv hard-links .venv by default
link-mode = "copy"
