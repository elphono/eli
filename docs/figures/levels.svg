<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <title>The ELI levels: a simple surface that zooms down to the code</title>
  <rect width="880" height="410" rx="18" fill="#fbfaf7"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1l8 4-8 4" fill="none" stroke="#5d636d" stroke-width="2"/></marker>
  </defs>
  <!-- ELI-lambda -->
  <rect x="30" y="28" width="380" height="74" rx="14" fill="#fdeee4" stroke="#c2410c" stroke-width="3"/>
  <text x="50" y="60" font-size="22" font-weight="800" fill="#c2410c">ELI-lambda · the default</text>
  <text x="50" y="88" font-size="17" fill="#1d1f23">what it does for you, and a diagram</text>
  <path d="M220 104v28" stroke="#5d636d" stroke-width="3" marker-end="url(#a)"/>
  <text x="234" y="124" font-size="16" fill="#5d636d">"go deeper" · a click</text>
  <!-- ELI-initiate -->
  <rect x="110" y="138" width="380" height="74" rx="14" fill="#e2ecfb" stroke="#1f5fbf" stroke-width="3"/>
  <text x="130" y="170" font-size="22" font-weight="800" fill="#1f5fbf">ELI-initiate</text>
  <text x="130" y="198" font-size="17" fill="#1d1f23">the mechanisms that make it work</text>
  <path d="M300 214v28" stroke="#5d636d" stroke-width="3" marker-end="url(#a)"/>
  <text x="314" y="234" font-size="16" fill="#5d636d">"under the hood"</text>
  <!-- ELI-Architect -->
  <rect x="190" y="248" width="380" height="74" rx="14" fill="#efe7fd" stroke="#7c3aed" stroke-width="3"/>
  <text x="210" y="280" font-size="22" font-weight="800" fill="#7c3aed">ELI-Architect</text>
  <text x="210" y="308" font-size="17" fill="#1d1f23">components, flows, key numbers</text>
  <path d="M380 324v28" stroke="#5d636d" stroke-width="3" marker-end="url(#a)"/>
  <text x="394" y="344" font-size="16" fill="#5d636d">⚙ one precise point</text>
  <!-- ELI-Tech -->
  <rect x="270" y="356" width="380" height="36" rx="10" fill="#efefed" stroke="#5d636d" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="290" y="381" font-size="18" font-weight="700" fill="#1d1f23">ELI-Tech · files, functions, code</text>
  <!-- side note -->
  <text x="610" y="70" font-size="17" fill="#1d1f23" font-weight="700">One level per reply.</text>
  <text x="610" y="96" font-size="16" fill="#5d636d">The next one is named,</text>
  <text x="610" y="118" font-size="16" fill="#5d636d">never unrolled:</text>
  <text x="610" y="150" font-size="15" fill="#5d636d" font-style="italic">ELI-lambda · one level down,</text>
  <text x="610" y="172" font-size="15" fill="#5d636d" font-style="italic">ELI-initiate: how it finds…</text>
</svg>
