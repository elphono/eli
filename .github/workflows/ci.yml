name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pinned: Playwright 1.58.0 (the dev dependency) cannot install Chromium on ubuntu-latest (26.04).
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check hooks tests tools skills
      - name: Chromium for render.py (the eli:figures tests render pages)
        run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q

  plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Claude Code validates the marketplace and the plugin
        run: |
          npx -y @anthropic-ai/claude-code plugin validate --json . > report.json || true
          python3 tools/check_plugin_report.py report.json
